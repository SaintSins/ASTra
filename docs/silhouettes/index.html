<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silhouettes</title>
    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="/tailwind-config.js"></script>
  </head>

  <body class="bg-editorial-bg text-editorial-text dark:bg-editorial-darkBg dark:text-editorial-darkText font-sans antialiased min-h-screen flex flex-col selection:bg-editorial-text selection:text-editorial-bg dark:selection:bg-editorial-darkText dark:selection:text-editorial-darkBg transition-colors duration-300">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 w-full bg-editorial-bg border-b border-editorial-border dark:bg-editorial-darkBg dark:border-editorial-darkBorder">
        <div class="max-w-4xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 sm:gap-0">
            <a href="/" class="text-xl font-serif tracking-tight text-editorial-text dark:text-editorial-darkText">Engineered Aesthetics</a>
            <div class="flex items-center gap-x-4 sm:gap-x-6 text-sm font-sans font-medium text-editorial-muted">
                <a href="/silhouettes" class="inline-flex items-center h-8 hover:text-editorial-text dark:hover:text-editorial-darkText transition-colors">Silhouettes</a>
                <a href="/construction" class="inline-flex items-center h-8 hover:text-editorial-text dark:hover:text-editorial-darkText transition-colors">Construction</a>
                <a href="/architects" class="inline-flex items-center h-8 hover:text-editorial-text dark:hover:text-editorial-darkText transition-colors">The Architects</a>
                <button 
                    id="theme-toggle" 
                    type="button" 
                    aria-label="Toggle theme"
                    class="inline-flex items-center justify-center h-8 w-8 border border-editorial-border dark:border-editorial-darkBorder text-editorial-text dark:text-editorial-darkText hover:bg-editorial-border/30 dark:hover:bg-editorial-darkBorder/40 transition-colors"
                >
                    <!-- Moon Icon: Shown in Light Mode (Click to go dark) -->
                    <svg class="inline dark:hidden w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                    </svg>

                    <!-- Sun Icon: Shown in Dark Mode (Click to go light) -->
                    <svg class="hidden dark:inline w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
            </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow w-full max-w-3xl mx-auto px-6 py-16 md:py-24">
        <!-- The 'prose' class tells Tailwind to automatically style your generated Markdown -->
        <article class="prose prose-editorial prose-lg dark:prose-invert">
            <div><h1>Silhouettes</h1><blockquote><b>01-09-2026</b> - <a href="/silhouettes/airforce">Nike Remasters the Air Force 1 to its Early-2000s Glory</a></blockquote></div>
        </article>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-editorial-bg border-t border-editorial-border mt-auto dark:bg-editorial-darkBg dark:border-editorial-darkBorder">
        <div class="max-w-4xl mx-auto px-6 py-8 text-center text-sm font-sans text-editorial-muted">
            &copy; 2026 SaintSins. Powered by ASTra.
        </div>
    </footer>

    <script>
    const themeToggleBtn = document.getElementById('theme-toggle');

    themeToggleBtn.addEventListener('click', () => {
        if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        }
    });
    </script>
  </body>
</html>
