<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ Title }}</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="w-full bg-white border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/ASTra/" class="text-xl font-bold tracking-tight text-gray-900">Engineered Aesthetics</a>
            <div class="space-x-6 text-sm font-medium text-gray-600">
                <a href="/ASTra/" class="hover:text-black transition-colors">Home</a>
                <a href="/ASTra/fashion/" class="hover:text-black transition-colors">Fashion</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow w-full max-w-4xl mx-auto px-6 py-16">
        <!-- The 'prose' class tells Tailwind to automatically style your generated Markdown -->
        <article class="prose prose-lg prose-gray max-w-none">
            {{ Content }}
        </article>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-4xl mx-auto px-6 py-8 text-center text-sm text-gray-500">
            &copy; 2026 SaintSins. Powered by ASTra.
        </div>
    </footer>

  
</html>
