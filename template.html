<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ Title }}</title>
    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="/tailwind/tailwind-config.js"></script>
  </head>

  <body class="bg-editorial-bg text-editorial-text font-sans antialiased min-h-screen flex flex-col selection:bg-editorial-text selection:text-editorial-bg">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 w-full bg-editorial-bg border-b border-editorial-border">
        <div class="max-w-4xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 sm:gap-0">
            <a href="/" class="text-xl font-serif tracking-tight text-editorial-text">Engineered Aesthetics</a>
            <div class="flex space-x-4 sm:space-x-6 text-sm font-sans font-medium text-editorial-muted">
                <a href="/silhouettes" class="hover:text-editorial-text transition-colors">Silhouettes</a>
                <a href="/construction" class="hover:text-editorial-text transition-colors">Construction</a>
                <a href="/architects" class="hover:text-editorial-text transition-colors">The Architects</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow w-full max-w-3xl mx-auto px-6 py-16 md:py-24">
        <!-- The 'prose' class tells Tailwind to automatically style your generated Markdown -->
        <article class="prose prose-editorial prose-lg ">
            {{ Content }}
        </article>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-editorial-bg border-t border-editorial-border mt-auto">
        <div class="max-w-4xl mx-auto px-6 py-8 text-center text-sm font-sans text-editorial-muted">
            &copy; 2026 SaintSins. Powered by ASTra.
        </div>
    </footer>

  
</html>
